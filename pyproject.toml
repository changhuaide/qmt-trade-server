[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qmt-trade-server"
version = "0.1.0"
authors = [
    { name="qmt-trade-server contributors" },
]
description = "HTTP bridge for QMT (XunTou) trading system - trade and query market data from external Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
keywords = ["qmt", "trading", "stock", "xtquant", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/yourusername/qmt-trade-server"
Issues = "https://github.com/yourusername/qmt-trade-server/issues"
